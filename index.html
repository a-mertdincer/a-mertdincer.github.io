<!DOCTYPE html>
<html>
  <head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QJ9TR5T9S2"></script>
    <script>

      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-QJ9TR5T9S2');

    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>d0tslash | Terminal</title>
    <link rel="stylesheet" type="text/css" media="screen" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="img/fav-icon.png" />
  </head>
  <body>
    <!-- Mobile keyboard toolbar -->
    <div id="mobile-keyboard-toolbar" class="mobile-keyboard-toolbar">
      <button class="kb-key" data-key="Tab">Tab</button>
      <button class="kb-key" data-key="Escape">Esc</button>
      <button class="kb-key kb-ctrl" data-key="Control">Ctrl</button>
      <button class="kb-key" data-key="ArrowUp">↑</button>
      <button class="kb-key" data-key="ArrowDown">↓</button>
      <button class="kb-key" data-key="ArrowLeft">←</button>
      <button class="kb-key" data-key="ArrowRight">→</button>
      <button class="kb-key" data-special="clear">Clear</button>
    </div>

    <div id="terminal">
      <a id="before"></a>
    </div>
    <div id="command">
      <textarea
        type="text"
        id="texter"
        onkeyup="typeIt(this, event)"
        onkeydown="typeIt(this, event);
                   moveIt(this.value.length, event)"
        onkeypress="typeIt(this, event);"
        autofocus
      ></textarea>
      <div id="liner">
        <span id="typer"></span><b class="cursor" id="cursor">█</b>
      </div>
    </div>
    <script src="js/caret.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/main.js"></script>
    <script src="js/mobile-keyboard.js"></script>
  </body>
